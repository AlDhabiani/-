<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <circle cx="880" cy="190" r="90" fill="#fff7ed" opacity="0.9"/>
  <circle cx="880" cy="190" r="130" fill="#fff7ed" opacity="0.15"/>
  <!-- skyline: old city towers -->
  <g fill="#451a03" opacity="0.85">
    <rect x="60" y="420" width="120" height="330"/>
    <polygon points="60,420 120,360 180,420"/>
    <rect x="210" y="480" width="150" height="270"/>
    <polygon points="210,480 285,410 360,480"/>
    <rect x="400" y="440" width="110" height="310"/>
    <polygon points="400,440 455,380 510,440"/>
    <rect x="550" y="500" width="170" height="250"/>
    <polygon points="550,500 635,430 720,500"/>
    <rect x="760" y="460" width="130" height="290"/>
    <polygon points="760,460 825,395 890,460"/>
    <rect x="920" y="510" width="220" height="240"/>
    <polygon points="920,510 1030,440 1140,510"/>
  </g>
  <!-- windows -->
  <g fill="#fde68a" opacity="0.85">
    <rect x="100" y="470" width="18" height="26"/><rect x="140" y="470" width="18" height="26"/>
    <rect x="100" y="530" width="18" height="26"/><rect x="140" y="530" width="18" height="26"/>
    <rect x="255" y="530" width="18" height="26"/><rect x="305" y="530" width="18" height="26"/>
    <rect x="255" y="590" width="18" height="26"/><rect x="305" y="590" width="18" height="26"/>
    <rect x="435" y="500" width="18" height="26"/><rect x="470" y="500" width="18" height="26"/>
    <rect x="590" y="550" width="18" height="26"/><rect x="640" y="550" width="18" height="26"/>
    <rect x="690" y="550" width="18" height="26"/>
    <rect x="800" y="510" width="18" height="26"/><rect x="840" y="510" width="18" height="26"/>
    <rect x="960" y="560" width="18" height="26"/><rect x="1010" y="560" width="18" height="26"/><rect x="1070" y="560" width="18" height="26"/>
  </g>
  <!-- ground -->
  <rect x="0" y="720" width="1200" height="30" fill="#2d1102" opacity="0.6"/>
  <text x="600" y="200" font-family="Cairo, Arial, sans-serif" font-size="92" font-weight="800" fill="#fffbeb" text-anchor="middle">صنعاء القديمة</text>
  <text x="600" y="265" font-family="Cairo, Arial, sans-serif" font-size="34" fill="#fde68a" text-anchor="middle">سحر التاريخ والعمران — 3 أيام</text>
</svg>
